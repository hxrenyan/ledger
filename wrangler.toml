name = "ledger"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# workers.dev 保留作为备用入口；关闭版本预览 URL（避免每个版本生成公开地址）
workers_dev = true
preview_urls = false

# 自定义域名：zone hxsmj.top 在本账号下，deploy 时自动建 DNS 记录并签发证书
# 注意：顶层键必须写在第一个表头（[assets]）之前，否则会被归入前面的表
routes = [
  { pattern = "ledger.hxsmj.top", custom_domain = true }
]

# 静态页在 public/（Vue 构建产物）；/api/* 必须先走 Worker
# /MP_verify_* 也要先走 Worker：not_found_handling = single-page-application 会把
# 找不到的路径兜底成 index.html，否则微信的业务域名校验文件取不到纯文本。
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/MP_verify_*"]


# D1：先执行 npm run db:create，把返回的 database_id 填到下面两处
[[d1_databases]]
binding = "DB"
database_name = "ledger-db"
database_id = "080ebddc-4649-4970-8bf9-b9b95c199c8b"
preview_database_id = "080ebddc-4649-4970-8bf9-b9b95c199c8b"

# 非敏感配置；JWT_SECRET / ADMIN_TOKEN / WX_APPID / WX_SECRET 放 .dev.vars / wrangler secret
# 可选：MP_VERIFY = 微信业务域名校验文件的内容（取 /MP_verify_<串>.txt 的纯文本内容），
#       配置后无需重新构建前端就能通过校验；也可以直接把 txt 丢进 public/。
[vars]

# ---------------------------------------------------------------------------
# 本地开发：npm run dev → wrangler dev --env local
# ---------------------------------------------------------------------------
[env.local]
name = "ledger"




[[env.local.d1_databases]]
binding = "DB"
database_name = "ledger-db"
database_id = "080ebddc-4649-4970-8bf9-b9b95c199c8b"
preview_database_id = "080ebddc-4649-4970-8bf9-b9b95c199c8b"

[env.local.vars]
