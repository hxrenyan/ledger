<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* 系统浏览器有的把 screen.width 报成物理像素，再按约 980px 缩小整页。
         必须在首次排版前写上视口，事后改 meta 往往已经来不及。 */
      (function () {
        var dpr = window.devicePixelRatio || 1
        var w = screen.width || 0
        var h = screen.height || 0
        if (dpr >= 2 && w > 800) w = Math.round(w / dpr)
        if (dpr >= 2 && h > 800) h = Math.round(h / dpr)
        var css = Math.min(w || 0, h || w || 0)
        var phone = navigator.maxTouchPoints > 0 && css >= 320 && css <= 540
        var content = phone
          ? 'width=' + css + ', initial-scale=1, viewport-fit=cover'
          : 'width=device-width, initial-scale=1, viewport-fit=cover'
        document.write('<meta name="viewport" content="' + content + '">')
      })()
    </script>
    <meta name="theme-color" content="#f4f5f8" />
    <title>记账</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
